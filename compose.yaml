services:
  movora:
    build: .
    image: movora:latest
    ports:
      - "8000:8000"
    volumes:
      - movora-data:/data
      # Mount your media read-only; inside the app add libraries pointing at /media/...
      #
      # propagation: rslave matters when the media lives on a network share (NFS/CIFS).
      # With Docker's default (rprivate) the container binds whatever is at the path the
      # instant it starts: if the share mounts a moment later during boot, the container
      # keeps an empty directory forever and every file looks missing. rslave lets mounts
      # that appear on the host afterwards show up inside the container, so Movora starts
      # without the share, reports it as unavailable, and heals itself when it returns.
      - type: bind
        source: ${MOVORA_MEDIA:-./media}
        target: /media
        read_only: true
        bind:
          propagation: rslave
    environment:
      # All generated data (db, transcodes, caches, thumbnails, log) lives in the volume.
      MOVORA_DATA_DIR: /data
      # Set these in a .env file next to this compose (compose substitutes them here).
      MOVORA_SECRET_KEY: ${MOVORA_SECRET_KEY:-}
      MOVORA_TMDB_API_KEY: ${MOVORA_TMDB_API_KEY:-}
      # Optional: keeps a side-loaded webOS TV client installed (see movora.devmode).
      MOVORA_WEBOS_DEV_TOKEN: ${MOVORA_WEBOS_DEV_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Intel GPU host (e.g. an N-series mini PC): uncomment to let the container reach
    # the GPU. The image already ships the QSV driver, so with the device passed
    # through the encoder auto-detection picks h264_qsv on its own. Leave this
    # commented on hosts without /dev/dri — the entry would fail container start.
    # devices:
    #   - /dev/dri:/dev/dri

volumes:
  movora-data:
